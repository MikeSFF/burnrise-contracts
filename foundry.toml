[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = false   # same as Remix's default pipeline; the contracts also build and pass with via_ir = true
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@uniswap/v4-core/=lib/v4-core/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read", path = "./out" }]

[fuzz]
runs = 256
